name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run setup
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:collector
        env:
          REDIS_URL: redis://127.0.0.1:6379
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [token-issuer/python, ohttp/python]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - if: matrix.package == 'token-issuer/python'
        run: python -m pip install -r requirements-dev.txt
      - if: matrix.package == 'ohttp/python'
        run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - if: matrix.package == 'token-issuer/python'
        run: python -m mypy
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up --build -d
      - run: docker compose run --build --rm demo
      - if: always()
        run: docker compose down -v
