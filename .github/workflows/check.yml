name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run setup
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [token-issuer/python, ohttp/python]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - if: matrix.package == 'token-issuer/python'
        run: python -m pip install -r requirements-dev.txt
      - if: matrix.package == 'ohttp/python'
        run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - if: matrix.package == 'token-issuer/python'
        run: python -m mypy
  issuer-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: token-issuer/typescript/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r token-issuer/python/requirements-dev.txt
      - run: npm ci
        working-directory: token-issuer/typescript
      # Both tests skip when the other language is missing; the guards make CI fail instead.
      - name: TypeScript signs, Python finalizes and verifies
        run: test -d ../typescript/node_modules/tsx && python -m pytest -q test_interop.py
        working-directory: token-issuer/python
      - name: Python signs, blindrsa-ts finalizes and verifies
        run: test -x "$FRAY_INTEROP_PYTHON" && node --import tsx --test test/interop.test.ts
        working-directory: token-issuer/typescript
        env:
          FRAY_INTEROP_PYTHON: ${{ env.pythonLocation }}/bin/python
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build TypeScript token issuer
        run: docker build --tag fray-check-issuer-typescript token-issuer/typescript
      - name: Build Python token issuer
        run: docker build --tag fray-check-issuer-python token-issuer/python
      - name: Build TypeScript OHTTP relay
        run: docker build --tag fray-check-ohttp-typescript ohttp/typescript
      - name: Build Python OHTTP relay
        run: docker build --tag fray-check-ohttp-python ohttp/python
