name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run setup
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [token-issuer/python, ohttp/python]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - if: matrix.package == 'token-issuer/python'
        run: python -m pip install -r requirements-dev.txt
      - if: matrix.package == 'ohttp/python'
        run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - if: matrix.package == 'token-issuer/python'
        run: python -m mypy
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build TypeScript token issuer
        run: docker build --tag fray-check-issuer-typescript token-issuer/typescript
      - name: Build Python token issuer
        run: docker build --tag fray-check-issuer-python token-issuer/python
      - name: Build TypeScript OHTTP services
        run: docker build --tag fray-check-ohttp-typescript ohttp/typescript
      - name: Build Python OHTTP relay
        run: docker build --tag fray-check-ohttp-python ohttp/python
