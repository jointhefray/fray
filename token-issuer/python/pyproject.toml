[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fray-token-issuer"
version = "0.1.0"
description = "Privacy token vending for Fray partners using RFC 9474 blind RSA signatures"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pycryptodome==3.23.0"]

[tool.setuptools.packages.find]
include = ["fray_token_issuer*"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
files = ["fray_token_issuer", "app.py"]

[[tool.mypy.overrides]]
module = ["Crypto.*"]
ignore_missing_imports = true
