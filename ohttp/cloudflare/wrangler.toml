name = "fray-ohttp-relay"
# Select your own account when deploying; no production account is configured here.
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
main = "src/index.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
# Add a custom domain you control before deploying.
# routes = [{ pattern = "ohttp.example.org", custom_domain = true }]

# A DNS-only TLS endpoint outside Cloudflare's IP ranges. See README.
[vars]
GATEWAY_URL = "https://gateway.example.org/ohttp"

# Secret binding, never a [vars] entry and never committed:
#   FRAY_RELAY_AUTH  shared secret sent to the gateway as Fray-Relay-Auth, 32-512
#                    base64/base64url characters, e.g. from `openssl rand -base64 48`.
#                    Set it with `npx wrangler secret put FRAY_RELAY_AUTH`. The gateway
#                    operator must accept the same value.
# Without a valid FRAY_RELAY_AUTH the Worker answers 503 and forwards nothing.
# Country comes from request.cf.country; no geolocation header is trusted.

[observability]
enabled = false
